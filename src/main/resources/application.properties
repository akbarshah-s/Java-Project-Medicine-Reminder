server.port=8080

spring.application.name=medicine-reminder

spring.datasource.url=jdbc:mysql://localhost:3306/medicine_reminder?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.task.scheduling.pool.size=2
app.excel.file=${MEDICINE_EXCEL_FILE:medicines.xlsx}
